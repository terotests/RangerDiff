name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RangerDiff
      - uses: actions/checkout@v4
        with:
          repository: terotests/Ranger
          # the compiler the committed dist/ was built with; keep it the
          # same rev as ranger.json
          ref: 351afc770e555aa0dc2e7fa13cda5a05fe829ba8
          path: Ranger
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: RangerDiff
        env:
          RANGER_DIR: ${{ github.workspace }}/Ranger
        run: npm test
      - name: The built module is up to date
        working-directory: RangerDiff
        env:
          RANGER_DIR: ${{ github.workspace }}/Ranger
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "dist/rangerdiff.mjs is stale: run npm run build" && exit 1)
