name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: RangerDiff
      - uses: actions/checkout@v4
        with:
          repository: terotests/Ranger
          # the compiler the committed dist/ was built with; keep it the
          # same rev as ranger.json
          ref: e3da7851bee8c7d3337fe404bef6fdc40cd34d46
          path: Ranger
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: RangerDiff
        env:
          RANGER_DIR: ${{ github.workspace }}/Ranger
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Real-time editing tests on Go
        working-directory: RangerDiff
        env:
          RANGER_DIR: ${{ github.workspace }}/Ranger
        run: npm run test:go
      - name: Real-time editing converges, next to Yjs
        working-directory: RangerDiff
        run: |
          npm ci
          npm run bench:collab -- --check
      - name: The built module is up to date
        working-directory: RangerDiff
        env:
          RANGER_DIR: ${{ github.workspace }}/Ranger
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "dist/rangerdiff.mjs is stale: run npm run build" && exit 1)
